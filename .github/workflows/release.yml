name: Multi-Platform Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the tag (for example 0.2.0)
        required: false
        default: "0.2.0"
      create_release:
        description: Create or update a GitHub release and attach the built artifacts
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  HUXERUI_SDK_VERSION: "0.4.0"

jobs:
  sdk:
    name: Check HuxerUI SDK release
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
    steps:
      - name: Check for the required SDK release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${HUXERUI_SDK_VERSION}"
          release=$(gh api --paginate repos/HuxerUI/HuxerUI/releases \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .tag_name")
          if [[ -n "$release" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::HuxerUI $tag has not been published. Run this workflow once the SDK is available."
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: sdk
    if: needs.sdk.outputs.available == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runs_on: windows-latest
            pkg: windows-x64
            ext: exe
          - platform: linux
            runs_on: ubuntu-latest
            pkg: linux-x64
            ext: AppImage
          - platform: macos
            runs_on: macos-latest
            pkg: macos-arm64
            ext: dmg
          - platform: android
            runs_on: ubuntu-latest
            pkg: android
            ext: apk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install HuxerUI SDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = $env:HUXERUI_SDK_VERSION
          $installer = Join-Path $env:RUNNER_TEMP "huxerui-install.ps1"
          Invoke-WebRequest -Uri "https://github.com/HuxerUI/HuxerUI/releases/download/v$version/install.ps1" -OutFile $installer
          & $installer -Version $version -Yes
          $sdk = Join-Path $env:LOCALAPPDATA "HuxerUI"
          "HUXERUI_HOME=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install HuxerUI SDK (macOS / Linux / Android)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          version="$HUXERUI_SDK_VERSION"
          installer="$RUNNER_TEMP/huxerui-install.sh"
          curl -fsSL "https://github.com/HuxerUI/HuxerUI/releases/download/v${version}/install.sh" -o "$installer"
          sh "$installer" --version "$version" --yes
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sdk="$HOME/Library/Developer/HuxerUI"
          else
            sdk="$HOME/.local/share/HuxerUI"
          fi
          echo "HUXERUI_HOME=$sdk" >> "$GITHUB_ENV"
          echo "$sdk/bin" >> "$GITHUB_PATH"

      - name: Install Linux build dependencies (desktop)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-4-dev libsoup-3.0-dev libglib2.0-dev libpango1.0-dev libcairo2-dev patchelf binutils
          curl -fsSL --retry 3 https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Set up Java (Android)
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Ninja (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Install Ninja (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: brew install ninja

      - name: Verify SDK
        shell: bash
        run: |
          huxerui --version
          huxerui doctor "${{ matrix.platform }}" || echo "huxerui doctor reported non-fatal issues"

      - name: Build and package (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: examples/preview
        run: |
          huxerui package windows --profile release
          if ($LASTEXITCODE -ne 0) {
            throw "huxerui package windows failed"
          }

      - name: Build and package (Unix / Android)
        if: matrix.platform != 'windows'
        shell: bash
        working-directory: examples/preview
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          huxerui package "${{ matrix.platform }}" --profile release

      - name: Show packaged output
        shell: bash
        run: ls -la "examples/preview/dist" | head -20

      - name: Smoke-run the Windows app and sample CPU (diagnose freeze)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = Get-Item "examples/preview/.huxerui/package/windows/release/staging/example_codeeditor.exe"
          if (-not $exe) {
            throw "Windows package is missing its staged application"
          }
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          $alive = -not $p.HasExited
          $cpuMs = 0
          if ($alive) {
            $cpuMs = [int]$p.TotalProcessorTime.TotalMilliseconds
          }
          Write-Host "SMOKE alive=$alive cpu_ms=$cpuMs"
          if ($alive) {
            Stop-Process -Id $p.Id -Force
          } else {
            throw "Windows app exited early (exit code $($p.ExitCode))"
          }

      - name: Name release asset
        shell: pwsh
        working-directory: examples/preview/dist
        run: |
          $packages = @(Get-ChildItem -LiteralPath "${{ matrix.platform }}" -File -Filter "*.${{ matrix.ext }}")
          if ($packages.Count -ne 1) {
            throw "Expected one ${{ matrix.ext }} package for ${{ matrix.platform }}, found $($packages.Count)"
          }
          Copy-Item -LiteralPath $packages[0].FullName -Destination "codeeditor-${{ matrix.pkg }}.${{ matrix.ext }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: examples/preview/dist/codeeditor-${{ matrix.pkg }}.${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=CodeEditor Preview ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "continuous=false" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=CodeEditor Preview v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "continuous=false" >> "$GITHUB_OUTPUT"
          else
            # Every successful main build refreshes the continuous pre-release.
            echo "tag=continuous" >> "$GITHUB_OUTPUT"
            echo "name=CodeEditor Preview Continuous" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "continuous=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean previous continuous release
        if: steps.release_tag.outputs.continuous == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete continuous --yes --cleanup-tag 2>/dev/null || true

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: false

      - name: List release assets
        shell: bash
        run: find dist -maxdepth 4 -type f | sort | head -60

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          prerelease: ${{ steps.release_tag.outputs.prerelease }}
          body: |
            Automatic build of CodeEditor Preview.

            Artifacts:
            - Windows x64: `codeeditor-windows-x64.exe` (installer)
            - Linux x64: `codeeditor-linux-x64.AppImage`
            - macOS arm64: `codeeditor-macos-arm64.dmg`
            - Android: `codeeditor-android.apk` (arm64-v8a + x86_64)
          generate_release_notes: true
          files: |
            dist/**
