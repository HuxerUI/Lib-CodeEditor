name: Windows Release Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version for the tag (for example 0.1.0)
        required: false
        default: "0.1.0"
      create_release:
        description: Create or update a GitHub release and attach the built exe
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 3dparty/SweetEditor and 3dparty/SweetLine are recorded in this
      # repository as gitlinks (mode 160000) without a .gitmodules file, so a
      # fresh checkout has no submodule mechanism to populate them. Fetch each
      # vendored repository at the exact commit the parent records.
      - name: Populate vendored dependencies (3dparty gitlinks)
        shell: pwsh
        run: |
          $repos = @(
            @{ name = "SweetEditor"; url = "https://github.com/FinalScave/SweetEditor" },
            @{ name = "SweetLine"; url = "https://github.com/FinalScave/SweetLine" }
          )
          foreach ($repo in $repos) {
            $entry = git ls-tree HEAD "3dparty/$($repo.name)"
            if (-not $entry) {
              throw "3dparty/$($repo.name) is not recorded as a gitlink in this repository"
            }
            $sha = ($entry -split "\s+")[2]
            $dir = "3dparty/$($repo.name)"
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            git init -q $dir
            git -C $dir remote add origin $repo.url
            git -C $dir fetch --depth 1 origin $sha
            git -C $dir checkout -q FETCH_HEAD
            Write-Host "Populated 3dparty/$($repo.name) at $sha"
          }

      - name: Install HuxerUI SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:TEMP "huxerui-install.ps1"
          Invoke-WebRequest -Uri "https://github.com/HuxerUI/HuxerUI/releases/latest/download/install.ps1" -OutFile $installer -UseBasicParsing
          # The installer resolves the latest version through the GitHub API,
          # which rate-limits unauthenticated requests from shared runner IPs.
          # Resolve the version here (with a fallback) and pass it explicitly so
          # the installer skips the API call.
          $version = $null
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/HuxerUI/HuxerUI/releases/latest" -Headers @{ "User-Agent" = "sweetedit-ci" }
            $version = ([string]$release.tag_name).TrimStart("v")
          } catch {
            Write-Host "Could not resolve the latest HuxerUI release: $($_.Exception.Message)"
          }
          if (-not $version) {
            $version = "0.1.0"
            Write-Host "Using fallback version $version"
          } else {
            Write-Host "Resolved latest HuxerUI release: $version"
          }
          & $installer -Version $version -Yes
          $sdk = Join-Path $env:LOCALAPPDATA "HuxerUI"
          if (-not (Test-Path $sdk)) {
            throw "HuxerUI SDK was not installed at $sdk"
          }
          "HUXERUI_HOME=$sdk" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "$sdk\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          Write-Host "HuxerUI SDK installed at $sdk"

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Verify SDK and toolchain
        shell: pwsh
        run: |
          huxerui --version
          huxerui doctor windows
          if ($LASTEXITCODE -ne 0) {
            throw "huxerui doctor windows reported problems"
          }

      - name: Build and package the Windows app
        shell: pwsh
        working-directory: examples/preview
        run: |
          huxerui package windows --profile release
          if ($LASTEXITCODE -ne 0) {
            throw "huxerui package windows failed"
          }

      - name: Show packaged output
        shell: pwsh
        run: Get-ChildItem -Recurse examples/preview/dist/windows | Select-Object FullName, Length

      - name: Smoke-run the app and sample CPU (diagnose freeze)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "examples/preview/dist/windows" -Filter *.exe -Recurse | Select-Object -First 1
          if (-not $exe) {
            throw "no exe found under examples/preview/dist/windows"
          }
          Write-Host "Launching $($exe.FullName)"
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 6
          $p.Refresh()
          $alive = -not $p.HasExited
          $cpuMs = 0
          if ($alive) {
            $cpuMs = [int]$p.TotalProcessorTime.TotalMilliseconds
          }
          Write-Host "SMOKE alive=$alive cpu_ms=$cpuMs"
          if ($alive) {
            Stop-Process -Id $p.Id -Force
            if ($cpuMs -gt 5000) {
              Write-Host "SMOKE verdict: busy loop / repaint storm (main thread spinning)"
            } else {
              Write-Host "SMOKE verdict: idle but unresponsive (blocked or deadlocked)"
            }
          } else {
            Write-Host "SMOKE verdict: app exited early (exit code $($p.ExitCode))"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sweetedit-preview-windows-x64
          path: examples/preview/dist/windows/
          if-no-files-found: error

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "name=SweetEdit Huxer ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=SweetEdit Huxer v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.create_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.name }}
          generate_release_notes: true
          files: |
            examples/preview/dist/windows/**
